<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Primary Meta Tags -->
    <title>Guilloche Studio | Precision Mathematical Pattern Engine</title>
    <meta name="title" content="Guilloche Studio | Precision Mathematical Pattern Engine" />
    <meta
      name="description"
      content="The industry standard for security printing, currency design, and mathematical art. High-precision parametric engine powered by WebAssembly."
    />
    <meta
      name="keywords"
      content="guilloche, security printing, mathematical art, parametric design, spirograph engine, vector patterns, bank-grade security, CNC patterns"
    />
    <meta name="author" content="Guilloche Studio" />
    <meta name="robots" content="index, follow" />

    <!-- Favicon and App Icons -->
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/icons/icon-192x192.png" />
    <link rel="manifest" href="%sveltekit.assets%/manifest.json" />

    <!-- Theme and Mobile -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Guilloche Studio" />
    <meta name="application-name" content="Guilloche Studio" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Guilloche Studio" />
    <meta property="og:title" content="Guilloche Studio | Precision Mathematical Pattern Engine" />
    <meta
      property="og:description"
      content="The gold standard for security printing and mathematical art. Uncompromised precision, directly in your browser."
    />
    <meta property="og:image" content="%sveltekit.assets%/guillochestudio.png" />
    <meta property="og:locale" content="en_US" />

    <!-- Structured Data - WebApplication Schema -->
    <script type="application/ld+json" nonce="%sveltekit.nonce%">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Guilloche Studio",
        "description": "Create intricate ornamental patterns for security printing and decorative design.",
        "url": "https://guillochestudio.com",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Web Browser",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "Mathematical pattern generation",
          "SVG/DXF/G-CODE export",
          "WASM-powered rendering engine",
          "AI-powered design assistance"
        ]
      }
    </script>

    <!-- DNS Prefetch for external services -->
    <link rel="dns-prefetch" href="https://js.stripe.com" />

    <!-- Preload critical resources -->
    <link rel="preload" href="%sveltekit.assets%/logo.svg" as="image" type="image/svg+xml" />
    <link
      rel="preload"
      href="/fonts/Sohne-Halbfett.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-white antialiased">
    <a
      href="#main-content"
      class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-black focus:text-white focus:rounded-full"
    >
      Skip to main content
    </a>

    <div style="display: contents" id="main-content">%sveltekit.body%</div>

    <noscript>
      <div class="fixed inset-0 bg-white text-black flex items-center justify-center p-8 z-50">
        <div class="text-center max-w-md">
          <h1 class="text-2xl font-bold mb-4">JavaScript Required</h1>
          <p class="text-gray-500">
            Guilloche Studio requires JavaScript for the mathematical engine. Please enable it to
            continue.
          </p>
        </div>
      </div>
    </noscript>
  </body>
</html>
