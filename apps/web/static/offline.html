<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - Guilloché Studio</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        text-align: center;
        max-width: 400px;
      }

      .pattern {
        width: 150px;
        height: 150px;
        margin: 0 auto 30px;
        opacity: 0.6;
      }

      .pattern svg {
        width: 100%;
        height: 100%;
        animation: pulse 3s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.4;
          transform: scale(1);
        }
        50% {
          opacity: 0.8;
          transform: scale(1.05);
        }
      }

      h1 {
        font-size: 28px;
        font-weight: 600;
        margin-bottom: 12px;
        color: #f8fafc;
      }

      p {
        font-size: 16px;
        color: #94a3b8;
        margin-bottom: 30px;
        line-height: 1.6;
      }

      .actions {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      button {
        padding: 14px 28px;
        font-size: 16px;
        font-weight: 500;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
      }

      .primary {
        background: #3b82f6;
        color: white;
      }

      .primary:hover {
        background: #2563eb;
      }

      .secondary {
        background: #334155;
        color: #e2e8f0;
      }

      .secondary:hover {
        background: #475569;
      }

      .status {
        margin-top: 30px;
        padding: 12px;
        background: #1e293b;
        border-radius: 8px;
        font-size: 14px;
        color: #64748b;
      }

      .status.online {
        background: #064e3b;
        color: #34d399;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="pattern">
        <svg viewBox="0 0 200 200">
          <defs>
            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color: #3b82f6" />
              <stop offset="100%" style="stop-color: #8b5cf6" />
            </linearGradient>
          </defs>
          <g fill="none" stroke="url(#grad)" stroke-width="1">
            <circle cx="100" cy="100" r="80" opacity="0.3" />
            <circle cx="100" cy="100" r="60" opacity="0.4" />
            <circle cx="100" cy="100" r="40" opacity="0.5" />
            <path d="M 100 20 Q 180 100 100 180 Q 20 100 100 20" opacity="0.6" />
            <path d="M 20 100 Q 100 20 180 100 Q 100 180 20 100" opacity="0.6" />
          </g>
        </svg>
      </div>

      <h1>You're Offline</h1>
      <p>
        It looks like you've lost your internet connection. Don't worry - your work is saved locally
        and will sync when you're back online.
      </p>

      <div class="actions">
        <button class="primary" onclick="location.reload()">Try Again</button>
        <button class="secondary" onclick="history.back()">Go Back</button>
      </div>

      <div class="status" id="status">Waiting for connection...</div>
    </div>

    <script>
      // Check online status
      function updateStatus() {
        const status = document.getElementById('status');
        if (navigator.onLine) {
          status.textContent = 'Connection restored! Reloading...';
          status.classList.add('online');
          setTimeout(() => location.reload(), 1000);
        } else {
          status.textContent = 'Still offline. Waiting for connection...';
          status.classList.remove('online');
        }
      }

      window.addEventListener('online', updateStatus);
      window.addEventListener('offline', updateStatus);
      updateStatus();
    </script>
  </body>
</html>
