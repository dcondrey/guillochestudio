# Cloudflare Pages Configuration
# For Guilloché Studio Pro - https://guillochestudio.com

name = "guillochestudio"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".svelte-kit/cloudflare"

# Environment variables (set these in Cloudflare Dashboard or via wrangler secret)
# SUPABASE_URL = ""
# SUPABASE_ANON_KEY = ""
# STRIPE_SECRET_KEY = ""
# STRIPE_WEBHOOK_SECRET = ""

[vars]
APP_NAME = "Guilloché Studio"
APP_URL = "https://guillochestudio.com"
API_VERSION = "v1"
ENVIRONMENT = "production"

# Preview environment (for non-production branches)
[env.preview]
vars = { ENVIRONMENT = "preview", APP_URL = "https://preview.guillochestudio.pages.dev" }

# Production environment
[env.production]
vars = { ENVIRONMENT = "production" }

# AI Worker bindings
[ai]
binding = "AI"

# KV Namespace for caching
[[kv_namespaces]]
binding = "PATTERN_CACHE"
id = "placeholder_kv_id"
preview_id = "placeholder_preview_kv_id"

# D1 Database (optional, for additional data)
# [[d1_databases]]
# binding = "DB"
# database_name = "guilloche-db"
# database_id = "placeholder_d1_id"

# R2 Bucket for pattern assets
[[r2_buckets]]
binding = "PATTERN_ASSETS"
bucket_name = "guilloche-assets"
preview_bucket_name = "guilloche-assets-preview"

# Durable Objects for real-time collaboration
# [[durable_objects.bindings]]
# name = "COLLABORATION"
# class_name = "CollaborationRoom"

# Rate limiting rules
# [[rules]]
# type = "RateLimit"
