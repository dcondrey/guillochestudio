[package]
name = "guilloche-c2pa-sign"
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
description = "Server-only wasm binding: COSE_Sign1/Ed25519 signing for guilloche export C2PA manifests. Never built into the client bundle."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.92"
c2pa-text-binding = { version = "0.3", default-features = false }
coset = { version = "0.3", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
zeroize = "1"
jumbf = "0.7.0"
ciborium = "0.2"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
sha2 = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]
