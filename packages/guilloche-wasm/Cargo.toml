[package]
name = "guilloche-wasm"
version = "0.1.0"
authors = ["Guilloché Studio"]
edition = "2021"
description = "High-performance WASM engine for Guilloché pattern generation"
license = "MIT"
repository = "https://github.com/guilloche-studio/guilloche"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2.92"
js-sys = "0.3.69"
web-sys = { version = "0.3.69", features = [
    "CanvasRenderingContext2d",
    "HtmlCanvasElement",
    "Document",
    "Window",
    "Performance",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"

# Better error messages in debug mode
console_error_panic_hook = { version = "0.1.7", optional = true }

# Efficient allocator for WASM
wee_alloc = { version = "0.4.5", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3.42"

[profile.release]
# Optimize for small code size
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-mutable-globals"]
