packages:
  - 'apps/*'
  - 'apps/workers/*'
  - 'packages/*'

allowBuilds:
  # Postinstall fetches the required platform-native binary; build fails without it.
  esbuild: true
  sharp: true
  workerd: true
  svelte-preprocess: true
  '@sentry/cli': false
  core-js: false
  es5-ext: false

overrides:
  typescript: ^5.4.0
  svelte: ^4.2.12
  vite: ^5.1.6
  zod: ^3.22.0
