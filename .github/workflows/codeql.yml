name: CodeQL Security Analysis

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
  schedule:
    # Run weekly on Sundays at midnight
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Analyze JavaScript/TypeScript code
  analyze-javascript:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.3
        with:
          languages: javascript-typescript
          config-file: .github/codeql/codeql-config.yml
          queries: +security-extended,security-and-quality

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build is optional but can improve analysis
      - name: Build
        run: pnpm build:web
        continue-on-error: true
        env:
          PUBLIC_SUPABASE_URL: placeholder
          PUBLIC_SUPABASE_ANON_KEY: placeholder
          PUBLIC_STRIPE_PUBLISHABLE_KEY: placeholder

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.3
        with:
          category: '/language:javascript-typescript'
          upload: true

  # Analyze Rust code (for WASM package)
  analyze-rust:
    name: Analyze Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/guilloche-wasm

      # Run clippy for Rust security analysis
      - name: Run Clippy
        working-directory: packages/guilloche-wasm
        run: |
          cargo clippy --all-targets --all-features -- \
            -D warnings \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::panic \
            -D clippy::todo \
            -D clippy::unimplemented \
            -W clippy::pedantic

      # Run cargo-audit for known vulnerabilities
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo-audit
        working-directory: packages/guilloche-wasm
        run: cargo audit

      # Upload SARIF for Rust (if using additional tools)
      - name: Generate SARIF
        uses: actions-rs/clippy-check@v1
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          args: --all-features --manifest-path packages/guilloche-wasm/Cargo.toml

  # Additional security checks
  security-checks:
    name: Additional Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Check for known vulnerabilities in npm packages
      - name: NPM Audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

      # Check for secrets in code
      - name: Secret scanning
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

      # Check for hardcoded credentials
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      # Dependency review for PRs
      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          allow-licenses: MIT, Apache-2.0, ISC, BSD-2-Clause, BSD-3-Clause, 0BSD, CC0-1.0, Unlicense
          deny-licenses: GPL-3.0, AGPL-3.0

  # Summary job
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [analyze-javascript, analyze-rust, security-checks]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## Security Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # JavaScript/TypeScript analysis
          if [[ "${{ needs.analyze-javascript.result }}" == "success" ]]; then
            echo "- :white_check_mark: JavaScript/TypeScript analysis passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :x: JavaScript/TypeScript analysis failed" >> $GITHUB_STEP_SUMMARY
          fi

          # Rust analysis
          if [[ "${{ needs.analyze-rust.result }}" == "success" ]]; then
            echo "- :white_check_mark: Rust analysis passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :x: Rust analysis failed" >> $GITHUB_STEP_SUMMARY
          fi

          # Additional security checks
          if [[ "${{ needs.security-checks.result }}" == "success" ]]; then
            echo "- :white_check_mark: Additional security checks passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :warning: Additional security checks had issues" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail on security issues
        if: needs.analyze-javascript.result == 'failure' || needs.analyze-rust.result == 'failure'
        run: |
          echo "Security analysis found issues. Please review the results."
          exit 1
