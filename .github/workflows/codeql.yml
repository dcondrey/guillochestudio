name: CodeQL Security Analysis

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
  schedule:
    # Run weekly on Sundays at midnight
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read
  security-events: write

# Cancel in-progress runs for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Analyze JavaScript/TypeScript code
  analyze-javascript:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          config-file: .github/codeql/codeql-config.yml
          queries: +security-extended,security-and-quality

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build is optional but can improve analysis
      - name: Build
        run: pnpm build:web
        continue-on-error: true
        env:
          PUBLIC_SUPABASE_URL: placeholder
          PUBLIC_SUPABASE_ANON_KEY: placeholder
          PUBLIC_STRIPE_PUBLISHABLE_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          STRIPE_PRICE_PRO_MONTHLY: price_placeholder
          STRIPE_PRICE_PRO_YEARLY: price_placeholder
          STRIPE_PRICE_ENTERPRISE_MONTHLY: price_placeholder
          STRIPE_PRICE_ENTERPRISE_YEARLY: price_placeholder

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
          # This private repository does not currently have GitHub Advanced
          # Security code-scanning uploads enabled. Run the analysis as a CI
          # check without making the upload itself a configuration failure.
          upload: never

  # Analyze Rust code (for WASM package)
  analyze-rust:
    name: Analyze Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Rust
        # Keep Clippy aligned with the pull-request workflow; update deliberately.
        uses: dtolnay/rust-toolchain@1.120.0
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/guilloche-wasm

      # Run clippy for Rust security analysis
      - name: Run Clippy
        working-directory: packages/guilloche-wasm
        run: |
          cargo clippy --all-targets --all-features -- \
            -D clippy::unwrap_used \
            -D clippy::expect_used \
            -D clippy::panic \
            -D clippy::todo \
            -D clippy::unimplemented \
            -W clippy::pedantic

      # Run cargo-audit for known vulnerabilities
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo-audit
        working-directory: packages/guilloche-wasm
        run: cargo audit

      # Upload SARIF for Rust (if using additional tools)
      - name: Generate SARIF
        uses: actions-rs/clippy-check@v1
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          args: --all-features --manifest-path packages/guilloche-wasm/Cargo.toml

  # Additional security checks
  security-checks:
    name: Additional Security Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Secret scanners compare commits and need the pull-request parents.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Check for known vulnerabilities in npm packages
      - name: NPM Audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

      # Check for secrets in code
      # A diff scan needs two distinct commits. On a push whose `before` is the
      # pushed commit (first push, force-push, scheduled run) BASE == HEAD and
      # the action exits 1, so only pull_request gets the diff range.
      - name: Secret scanning (diff)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

      - name: Secret scanning (full)
        if: github.event_name != 'pull_request'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

      # Check for hardcoded credentials
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
          # The scan itself passes; uploading its SARIF fails once the account's
          # artifact storage quota is hit, which failed the whole job.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

      # Dependency review for PRs
      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        # Private repositories without GitHub Advanced Security do not expose
        # the dependency-review API. Keep the supported scanners authoritative.
        continue-on-error: true
        with:
          fail-on-severity: high
          allow-licenses: MIT, Apache-2.0, ISC, BSD-2-Clause, BSD-3-Clause, 0BSD, CC0-1.0, Unlicense

  # Summary job
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [analyze-javascript, analyze-rust, security-checks]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## Security Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # JavaScript/TypeScript analysis
          if [[ "${{ needs.analyze-javascript.result }}" == "success" ]]; then
            echo "- :white_check_mark: JavaScript/TypeScript analysis passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :x: JavaScript/TypeScript analysis failed" >> $GITHUB_STEP_SUMMARY
          fi

          # Rust analysis
          if [[ "${{ needs.analyze-rust.result }}" == "success" ]]; then
            echo "- :white_check_mark: Rust analysis passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :x: Rust analysis failed" >> $GITHUB_STEP_SUMMARY
          fi

          # Additional security checks
          if [[ "${{ needs.security-checks.result }}" == "success" ]]; then
            echo "- :white_check_mark: Additional security checks passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- :warning: Additional security checks had issues" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail on security issues
        if: needs.analyze-javascript.result == 'failure' || needs.analyze-rust.result == 'failure'
        run: |
          echo "Security analysis found issues. Please review the results."
          exit 1
