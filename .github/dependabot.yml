# Dependabot configuration
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # NPM/pnpm dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Los_Angeles'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps(dev)'
    labels:
      - 'dependencies'
      - 'npm'
    groups:
      # Group minor and patch updates for production dependencies
      production-minor:
        patterns:
          - '*'
        exclude-patterns:
          - '@types/*'
          - 'typescript'
          - 'vitest'
          - 'playwright'
          - 'eslint*'
          - 'prettier'
        update-types:
          - 'minor'
          - 'patch'
      # Group TypeScript and type definitions
      typescript:
        patterns:
          - '@types/*'
          - 'typescript'
        update-types:
          - 'minor'
          - 'patch'
      # Group testing tools
      testing:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - '@testing-library/*'
          - 'playwright'
          - '@playwright/*'
        update-types:
          - 'minor'
          - 'patch'
      # Group linting tools
      linting:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'prettier'
          - '@sveltejs/eslint-*'
        update-types:
          - 'minor'
          - 'patch'
      # Group Svelte ecosystem
      svelte:
        patterns:
          - 'svelte'
          - '@sveltejs/*'
          - 'svelte-*'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # Ignore major updates for critical packages (review manually)
      - dependency-name: 'svelte'
        update-types: ['version-update:semver-major']
      - dependency-name: '@sveltejs/kit'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  # Rust/Cargo dependencies
  - package-ecosystem: 'cargo'
    directory: '/packages/guilloche-wasm'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Los_Angeles'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'deps(rust)'
    labels:
      - 'dependencies'
      - 'rust'
    groups:
      # Group all Rust dependency updates
      rust-dependencies:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  # GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Los_Angeles'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'ci'
    labels:
      - 'dependencies'
      - 'github-actions'
    ignore:
      # This action's tags select a Rust toolchain rather than an action
      # version, so dependabot reads "@stable"/"@1.96.0" as a version to bump
      # and proposes releases of Rust that do not exist. One such bump landed
      # as @1.120.0 and broke the Rust analysis job.
      - dependency-name: 'dtolnay/rust-toolchain'
    groups:
      # Group all GitHub Actions updates
      actions:
        patterns:
          - '*'
        update-types:
          - 'minor'
          - 'patch'

  # Docker (if applicable)
  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'America/Los_Angeles'
    open-pull-requests-limit: 2
    commit-message:
      prefix: 'deps(docker)'
    labels:
      - 'dependencies'
      - 'docker'

# Registries for private packages (uncomment if needed)
# registries:
#   npm-github:
#     type: npm-registry
#     url: https://npm.pkg.github.com
#     token: ${{ secrets.GITHUB_TOKEN }}
